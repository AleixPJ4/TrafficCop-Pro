<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TrafficCop Pro</title>
  <link rel="stylesheet" href="styles-v05.css?v=5">
</head>
<body>
<header>
  <div>
    <small>HERRAMIENTA POLICIAL · TRÁFICO</small>
    <h1>TrafficCop <span>Pro</span></h1>
  </div>
  <button id="theme">◐</button>
</header>

<main>
  <section class="hero">
    <b>v0.5 · REPARADA</b>
    <h2>Busca una infracción en segundos</h2>
    <p>Versión de prueba funcional para iPhone y Android.</p>
    <div class="search">
      <span>⌕</span>
      <input id="q" placeholder="Móvil, ITV, matrícula, VMP…" autocomplete="off">
    </div>
    <div class="chips">
      <button data-q="móvil">📱 Móvil</button>
      <button data-q="ITV">🧾 ITV</button>
      <button data-q="VMP">🛴 VMP</button>
      <button data-q="matrícula">🔢 Matrículas</button>
    </div>
  </section>

  <section class="tabs">
    <button data-view="all" class="active">Todas</button>
    <button data-view="fav">★ Favoritos</button>
    <span id="count"></span>
  </section>

  <aside><strong>Versión DEMO:</strong> las fichas no sirven todavía para formular denuncias reales.</aside>
  <section id="results"></section>
</main>

<nav>
  <button data-view="all">⌕<small>Buscar</small></button>
  <button data-view="fav">★<small>Favoritos</small></button>
  <button id="install">⬇<small>Instalar</small></button>
</nav>

<template id="tpl">
  <article>
    <div class="head">
      <span class="badge">DEMO</span>
      <button class="star">☆</button>
    </div>
    <h3></h3>
    <p class="desc"></p>
    <div class="metrics">
      <div><small>Artículo</small><b class="art"></b></div>
      <div><small>Opción</small><b class="opt"></b></div>
      <div><small>Importe</small><b class="amount"></b></div>
      <div><small>Puntos</small><b class="pts"></b></div>
    </div>
    <details>
      <summary>Ver ficha completa</summary>
      <p><strong>Responsable:</strong> <span class="resp"></span></p>
      <p><strong>Calificación:</strong> <span class="grade"></span></p>
      <p><strong>Observaciones:</strong> <span class="notes"></span></p>
    </details>
    <button class="copy">Copiar concepto</button>
  </article>
</template>

<script src="app-v05.js?v=5"></script>
</body>
</html>
